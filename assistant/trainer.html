<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProBody | Premium Gym Planner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<main id="app-container" style="display:none;">
    
  <div id="errorMessage" class="alert alert-danger d-none m-3" style="position:fixed; top:10px; left:10px; right:10px; z-index:1060;" role="alert"></div>
  
  <div class="container mt-4">
    <div class="profile-card card glass p-3 mx-auto">
      <div class="d-flex align-items-center">
        <img id="userAvatar" src="../Logo.png" alt="User profile" class="rounded-circle me-3 user-avatar" onerror="this.src='https://via.placeholder.com/60';">
        <div class="user-info flex-grow-1">
          <h5 class="text-white fw-bold mb-0 " id="userName">User</h5>
          <small class="text-white-50" id="todayDate">Loading date...</small>
        </div>
        <div class="d-flex align-items-center">
          <!-- "Edit Profile" button has been removed -->
          <button class="btn btn-icon" data-bs-toggle="modal" data-bs-target="#recommendationsModal" aria-label="View Recommendations"><i class="material-icons">lightbulb</i></button>
        </div>
      </div>
      <div class="user-stats-grid mt-3">
        <div><i class="text-white material-icons text-gradient">scale</i><span class="text-white" id="userWeightStat">-- kg</span></div>
        <div><i class="text-white material-icons text-gradient">cake</i><span class="text-white" id="userAgeStat">-- yrs</span></div>
        <div><i class="text-white material-icons text-gradient">event_available</i><span class="text-white" id="gymDayCount">-- days</span></div>
      </div>
      <div class="mt-2">
        <div class="progress" role="progressbar"><div class="progress-bar" id="trainingProgress" style="width: 0%"></div></div>
        <p class="text-white-50 mt-1 mb-0 small" id="gymStatus">Plan your workouts to begin!</p>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <!-- CALENDAR SECTION -->
    <section id="calendarSection">
      <div class="card glass">
        <div class="card-body p-2 p-md-3">
          <div id="calendarGrid" class="row row-cols-2 row-cols-md-7 g-3 text-center"></div>
          </div>
      </div>
      <div class="text-center mt-3" id="goTrainingContainer" style="display:none;">
        <button class="btn btn-gradient-theme btn-lg shadow" id="goTrainingBtn"><i class="material-icons me-2">check_circle</i> Finalize & Start Plan</button>
      </div>
    </section>
  
    <!-- DASHBOARD SECTION -->
    <section id="dashboardSection" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 id="todayHeading" class="mb-0 fw-bold"><i class="material-icons me-2 text-gradient">fitness_center</i>Today's Workout</h3>
        <div class="d-flex gap-2">
          <button id="editBtn" class="btn btn-secondary btn-sm"><i class="material-icons">edit</i> Edit Plan</button>
          <button id="resetBtn" class="btn btn-danger btn-sm"><i class="material-icons">delete</i> Reset All</button>
        </div>
      </div>
      <div id="todayCards" class="row g-3"></div>
      <div class="card glass mt-4">
        <div class="card-body">
          <h5 class="text-white card-title mb-3">Weekly Muscle Group Distribution</h5>
          <div class="chart-container"><canvas id="timelineChart"></canvas></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modals -->
  <!-- "Edit Profile" modal has been removed -->
  <div class="modal fade" id="recommendationsModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content glass"><div class="modal-header"><h5 class="modal-title">Fitness Recommendations</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><ul id="recommendationsList" class="list-unstyled"></ul></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
  <div class="modal fade" id="categoryModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content glass"><div class="modal-header"><h5 class="modal-title"><i class="material-icons me-2">calendar_today</i>Choose Categories</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3 text-center"><button class="btn btn-rest mb-2">Rest Day <i class="material-icons ms-1">bed</i></button></div><div id="modalCategoryGrid" class="d-flex flex-wrap justify-content-center gap-2"></div></div><div class="modal-footer"><button type="button" class="btn btn-success" id="modalSaveBtn">Save Day</button></div></div></div></div>
  <div class="modal fade" id="exerciseDescriptionModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content glass"><div class="modal-header"><h5 class="modal-title" id="exerciseDescriptionModalLabel"></h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><img id="exerciseImage" src="" alt="Exercise" class="img-fluid mb-3"><p id="exerciseDescription"></p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
</main>

<button id="musicFab" class="fab" onclick="window.location.href='./music.html'"><span class="material-icons">music_note</span></button>
<footer class="mt-5 py-4"><div class="container text-center"><p class="mb-1 text-white-50">&copy; 2025 ProBody. All rights reserved.</p></div></footer>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="./script.js"></script>
</body>
</html>
