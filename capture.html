<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ProBody | Capture</title>

  <!-- Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #121212, #1F1F1F);
      --accent-primary: #8A2BE2; /* A vibrant purple */
      --accent-secondary: #C73866;
      --accent-gradient: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      --text-color: #EAEAEA;
      --text-muted: #9E9E9E;
      --glass-bg: rgba(30, 30, 30, 0.6);
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
      --glass-blur: blur(16px);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --font-family: 'Inter', sans-serif;
      --focus-ring: 0 0 0 3px rgba(138, 43, 226, 0.4);
    }
    body {
      background: var(--bg-gradient); color: var(--text-color); font-family: var(--font-family);
      margin: 0; padding: 0 0 calc(120px + env(safe-area-inset-bottom)); overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* --- TOP BAR & CONTROLS --- */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(18,18,18,0.7); backdrop-filter: var(--glass-blur); padding: 1rem 1.5rem; border-bottom: var(--glass-border); position: sticky; top: 0; z-index: 200; }
    .top-bar .page-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .top-icons { display: flex; align-items: center; gap: 0.75rem; }
    .top-icons button, .top-icons .btn-import-label { background: var(--glass-bg); border: var(--glass-border); color: var(--text-color); border-radius: 50%; width: 44px; height: 44px; display: inline-flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .top-icons button:hover, .top-icons .btn-import-label:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
    .top-icons i { width: 20px; height: 20px; }
    .notification-badge { position: absolute; top: -4px; right: -4px; background: var(--accent-secondary); font-size: 0.7rem; font-weight: 600; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 2px solid #121212; }
    
    /* --- CAMERA & CONTROLS --- */
    #cameraContainer { position: relative; width: clamp(300px, 92vw, 480px); margin: 1.5rem auto; aspect-ratio: 3 / 4; border-radius: 2rem; overflow: hidden; background: #000; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.15); }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; pointer-events: none; transition: opacity 0.3s ease; }
    .dropdown { display: flex; justify-content: center; margin: 1rem 0; }
    .dropdown .dropdown-toggle { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); color: var(--text-color); padding: 0.75rem 1.5rem; border-radius: 50px; }
    .dropdown .dropdown-menu { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); }
    .dropdown .dropdown-item { color: var(--text-color); }
    .dropdown .dropdown-item:hover { background: rgba(255, 255, 255, 0.1); }
    .control-bar { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; align-items: center; z-index: 100; background: var(--glass-bg); backdrop-filter: var(--glass-blur); padding: 0.75rem; border-radius: 50px; border: var(--glass-border); box-shadow: var(--shadow); }
    .control-bar button { display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease-out; color: var(--text-color); position: relative; }
    .control-bar .btn-light { background: transparent; width: 64px; height: 64px; }
    .control-bar .btn-light:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .control-bar .btn-danger { background: var(--accent-gradient); width: 80px; height: 80px; box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4); animation: pulse-capture 2s infinite; }
    .control-bar .btn-danger:hover { transform: scale(1.08); animation-play-state: paused; }
    #timerLabel { position: absolute; bottom: 8px; font-size: 0.75rem; font-weight: 600; }
    #countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(6rem, 25vw, 10rem); font-weight: 700; color: var(--text-color); text-shadow: 0 5px 25px rgba(0, 0, 0, 0.5); z-index: 9999; animation: pulse-countdown 1s infinite; pointer-events: none; }
    
    /* UNIFIED MODAL STYLES */
    .modal-content.glass { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: 1.5rem; box-shadow: var(--shadow); color: var(--text-color); }
    .modal-header { border-bottom: var(--glass-border); }
    .modal-footer { border-top: var(--glass-border); }
    .modal-footer button { border-radius: 50px; padding: 0.75rem 1.5rem; font-weight: 600; flex-grow: 1; border: none; transition: all 0.2s ease; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-color); }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    .btn-success { background: var(--accent-gradient); color: white; }
    .btn-success:hover { transform: translateY(-2px); filter: brightness(1.1); }
    #previewImage { border-radius: 1rem; max-height: 50vh; object-fit: contain; }
    .form-control, .form-select { background: rgba(0,0,0,0.3); border: var(--glass-border); color: var(--text-color); border-radius: 0.75rem; }
    .form-control:focus, .form-select:focus { background: rgba(0,0,0,0.4); color: var(--text-color); border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
    .progress { border-radius: 50px; background: rgba(0,0,0,0.3); border: var(--glass-border); padding: 0; }
    .progress-bar { background: var(--accent-gradient); font-weight: 600; transition: width 0.4s ease; }

    /* NOTIFICATION BAR */
    .notification-bar { position: fixed; right: -100%; top: 0; bottom: 0; width: clamp(300px, 85vw, 400px); background: rgba(18,18,18,0.8); backdrop-filter: var(--glass-blur); border-left: var(--glass-border); padding: 1.5rem; z-index: 300; transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; }
    .notification-bar.active { right: 0; box-shadow: var(--shadow); }
    .notification-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .notification-header h3 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .toggle-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; }
    .toggle-btn:before { content: '×'; font-size: 2rem; line-height: 1; }
    .notification-list { flex-grow: 1; overflow-y: auto; }
    .notification { background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; border: var(--glass-border); border-left-width: 4px; animation: fadeIn 0.5s ease; }
    .notification.success { border-left-color: #28a745; }
    .notification.error { border-left-color: var(--accent-secondary); }
    
    @keyframes pulse-capture { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes pulse-countdown { 0% { opacity: 1; } 50% { opacity: 0.9; } 100% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Top Bar with Import Button -->
  <div class="top-bar">
    <h2 class="page-title">Capture</h2>
    <div class="top-icons">
      <button id="flashBtn" onclick="toggleFlash()" title="Toggle Flash"><i data-lucide="zap"></i></button>
      <button id="notificationToggle" onclick="toggleNotificationBar()" title="Notifications">
        <i data-lucide="bell"></i>
        <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
      </button>
      <label for="photoInput" class="btn-import-label" title="Import from Gallery"><i data-lucide="upload"></i></label>
      <input type="file" id="photoInput" accept="image/*" class="d-none">
    </div>
  </div>

  <!-- Camera & Controls -->
  <div id="cameraContainer"><video id="video" autoplay playsinline></video><img id="overlay" alt="Onion skin overlay"/></div>
  <canvas id="canvas" class="d-none"></canvas>
  <div class="dropdown">
    <button class="btn dropdown-toggle" type="button" id="tagMenu" data-bs-toggle="dropdown"><i data-lucide="tag"></i> Front</button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#" onclick="setTag('Front')">Front</a></li>
      <li><a class="dropdown-item" href="#" onclick="setTag('Back')">Back</a></li>
      <li><a class="dropdown-item" href="#" onclick="setTag('Side')">Side</a></li>
    </ul>
  </div>
  <div class="control-bar">
    <button class="btn btn-light" onclick="toggleCamera()" title="Switch Camera"><i data-lucide="refresh-ccw"></i></button>
    <button class="btn btn-danger" onclick="takePhoto()" title="Capture"><i data-lucide="camera"></i></button>
    <button class="btn btn-light" id="timerButton" onclick="cycleTimer()" title="Timer"><i data-lucide="clock"></i><span id="timerLabel">0s</span></button>
  </div>
  <div id="countdown" style="display:none;"></div>
  
  <!-- UNIFIED Upload Confirmation Modal -->
  <div class="modal fade" id="uploadConfirmationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Upload</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <img id="previewImage" src="" alt="Upload preview" class="img-fluid mb-3"/>
          <div class="mb-3">
            <label for="photoDate" class="form-label">Date</label>
            <input type="date" id="photoDate" class="form-control">
          </div>
          <div class="mb-3">
            <label for="photoTag" class="form-label">Tag</label>
            <select id="photoTag" class="form-select">
              <option selected disabled>Choose...</option>
              <option value="Front">Front</option>
              <option value="Back">Back</option>
              <option value="Side">Side</option>
            </select>
          </div>
          <div id="uploadProgressContainer" class="progress d-none" style="height: 1.5rem;"><div id="uploadProgressBar" class="progress-bar" style="width:0%">0%</div></div>
        </div>
        <div class="modal-footer p-3">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success" id="confirmUploadButton">Confirm & Upload</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Bar -->
  <div class="notification-bar" id="notificationBar">
      <div class="notification-header">
          <h3>Notifications</h3>
          <button class="toggle-btn" onclick="toggleNotificationBar()"></button>
      </div>
      <div class="notification-list" id="notificationList"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  
  <script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
  apiKey: "AIzaSyCpOy4pqmtIsvJMtgoCzbQkLYTwR61cExk",
  authDomain: "probody-deec4.firebaseapp.com",
  databaseURL: "https://probody-deec4-default-rtdb.firebaseio.com",
  projectId: "probody-deec4",
  storageBucket: "probody-deec4.firebasestorage.app",
  messagingSenderId: "704731000262",
  appId: "1:704731000262:web:4b3f4c4b8a0c4e71a8d6c7",
  measurementId: "G-PNXEC12ZX4"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();
    const demoOverlays = {
        Front: "./front.png",
        Back: "./back.png",
        Side: "./1side.png"
    };
    // --- Global & State Variables ---
    let currentUser = null;
    let currentStream, currentTrack;
    let useFrontCamera = true;
    let torchEnabled = false;
    let capturedBlobSource = null; // Can be a dataURL (from camera) or a File object (from import)
    const timerOptions = [0, 3, 5, 10];
    let timerIndex = 0;
    let notificationCount = 0;
    let confirmationModal = null;

    // --- Main Initializer ---
    $(document).ready(() => {
        lucide.createIcons();
        startCamera();
        setTag("Front"); // Set initial tag and load onion skin
        confirmationModal = new bootstrap.Modal($('#uploadConfirmationModal'));

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadInitialOverlays(user.uid);
            } else {
                addNotification({ title: "Login Required", description: "Redirecting..." }, "error");
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            }
        });

        // --- Event Listeners ---
        $('#photoInput').on('change', handleFileSelect);
        $('#confirmUploadButton').on('click', handleConfirmUpload);
    });

    // --- UNIFIED UPLOAD FLOW ---
    function handleConfirmUpload() {
        const date = $('#photoDate').val();
        const tag = $('#photoTag').val();

        if (!capturedBlobSource || !date || !tag) {
            return addNotification({ title: "Missing Info", description: "Please ensure a date and tag are selected." }, "error");
        }

        const blob = (typeof capturedBlobSource === 'string') ? dataURLtoBlob(capturedBlobSource) : capturedBlobSource;
        
        const ui = {
            footer: $("#uploadConfirmationModal .modal-footer"),
            progressContainer: $("#uploadProgressContainer"),
            progressBar: $("#uploadProgressBar")
        };

        ui.footer.find("button").prop("disabled", true);
        ui.progressBar.removeClass('bg-danger bg-success').css("width", "0%").text("0%");
        ui.progressContainer.removeClass("d-none");
        
        uploadFileToFirebase({
            blob: blob,
            tag: tag,
            dateString: date,
            onProgress: (progress) => {
                ui.progressBar.css("width", `${progress}%`).text(`${Math.floor(progress)}%`);
            },
            onSuccess: (downloadURL) => {
                ui.progressBar.addClass('bg-success').text('Success!');
                setTimeout(() => {
                    confirmationModal.hide();
                    ui.footer.find("button").prop("disabled", false);
                    ui.progressContainer.addClass("d-none");
                }, 1000);

                // Update onion skin with the new photo
                localStorage.setItem(`lastPhotoURL_${tag}`, downloadURL);
                if ($("#tagMenu").text().trim() === tag) {
                    $("#overlay").attr("src", downloadURL);
                }
                addNotification({ title: "Success!", description: `${tag} photo saved.` }, "success");
            },
            onError: (error) => {
                ui.progressBar.addClass('bg-danger').text('Upload Failed');
                addNotification({ title: "Upload Failed", description: error.message }, "error");
                 setTimeout(() => {
                    ui.footer.find("button").prop("disabled", false);
                    ui.progressContainer.addClass("d-none");
                }, 2000);
            }
        });
    }

    function uploadFileToFirebase({ blob, tag, dateString, onProgress, onSuccess, onError }) {
        if (!currentUser) return onError(new Error("User not authenticated."));

        const filename = `${tag.toLowerCase()}-${Date.now()}.png`;
        const storageRef = storage.ref(`photos/${currentUser.uid}/${dateString}/${filename}`);
        const uploadTask = storageRef.put(blob);

        uploadTask.on("state_changed",
            (snapshot) => onProgress((snapshot.bytesTransferred / snapshot.totalBytes) * 100),
            (error) => onError(error),
            async () => {
                try {
                    const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                    const dbRef = db.ref(`users/${currentUser.uid}/gallery/${dateString}`);
                    await dbRef.update({ [tag.toLowerCase()]: downloadURL });
                    await db.ref(`users/${currentUser.uid}/uploads`).transaction(c => (c || 0) + 1);
                    onSuccess(downloadURL);
                } catch (dbError) {
                    onError(dbError);
                }
            }
        );
    }

    // --- Camera & Import Triggers ---
    function captureNow() {
        try {
            const video = $("#video")[0];
            const canvas = $("#canvas")[0];
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            if(useFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedBlobSource = canvas.toDataURL("image/png");
            
            $("#previewImage").attr("src", capturedBlobSource);
            $("#photoDate").val(new Date().toISOString().split('T')[0]);
            $("#photoTag").val($("#tagMenu").text().trim());
            confirmationModal.show();
        } catch (err) {
            addNotification({ title: "Capture Error", description: `Failed to capture image: ${err.message}` }, "error");
        }
    }

    function handleFileSelect(e) {
        if (!e.target.files[0]) return;
        capturedBlobSource = e.target.files[0];
        
        $("#previewImage").attr("src", URL.createObjectURL(capturedBlobSource));
        $("#photoDate").val(new Date().toISOString().split('T')[0]);
        $("#photoTag").val(''); // Reset tag for user selection
        confirmationModal.show();
        
        $('#photoInput').val(''); // Clear input to allow re-selecting the same file
    }

    // --- UI & Helper Functions ---
    async function startCamera() {
        try {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            const constraints = { video: { facingMode: useFrontCamera ? "user" : "environment" } };
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            $("#video")[0].srcObject = currentStream;
            currentTrack = currentStream.getVideoTracks()[0];
        } catch (err) {
            addNotification({ title: "Camera Error", description: `Could not access camera: ${err.message}` }, "error");
        }
    }

    function takePhoto() {
        const selectedTimer = timerOptions[timerIndex];
        if (selectedTimer > 0) {
            let remaining = selectedTimer;
            $("#countdown").text(remaining).show();
            const timerCountdown = setInterval(() => {
                remaining--;
                if (remaining > 0) $("#countdown").text(remaining);
                else { clearInterval(timerCountdown); $("#countdown").hide(); captureNow(); }
            }, 1000);
        } else { captureNow(); }
    }
    
function setTag(tag) {
    $("#tagMenu").html(`<i data-lucide="tag"></i> ${tag}`);
    lucide.createIcons();

    const lastPhotoURL = localStorage.getItem(`lastPhotoURL_${tag}`);
    
    const overlaySrc = lastPhotoURL || demoOverlays[tag] || "";

    $("#overlay").attr("src", overlaySrc);
}
    
    function loadInitialOverlays(uid) {
        const tags = ['Front', 'Back', 'Side'];
        tags.forEach(tag => {
            const lastUrl = localStorage.getItem(`lastPhotoURL_${tag}`);
            if (lastUrl && $("#tagMenu").text().trim() === tag) {
                 $("#overlay").attr("src", lastUrl);
            }
        });
    }

    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(",");
        const mime = parts[0].match(/:(.*?);/)[1];
        const b64 = atob(parts[1]);
        let n = b64.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = b64.charCodeAt(n);
        return new Blob([u8arr], { type: mime });
    }

    // --- FIXED: Missing Functions ---
    function toggleCamera() { useFrontCamera = !useFrontCamera; startCamera(); }
    async function toggleFlash() {
        if (!currentTrack || !currentTrack.getCapabilities().torch) return addNotification({ title: "Flash Unavailable", description: "Flash is not available." }, "error");
        try {
            torchEnabled = !torchEnabled;
            await currentTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
        } catch (err) { addNotification({ title: "Flash Error", description: err.message }, "error"); }
    }
    function toggleNotificationBar() { $("#notificationBar").toggleClass("active"); }
    function cycleTimer() { timerIndex = (timerIndex + 1) % timerOptions.length; $("#timerLabel").text(`${timerOptions[timerIndex]}s`); }
    function addNotification({ title, description, type = "info" }) {
        const notificationId = `notif-${Date.now()}`;
        const notificationHTML = `<div class="notification ${type}" id="${notificationId}"><strong>${title}</strong><p>${description}</p></div>`;
        $("#notificationList").prepend(notificationHTML);
        setTimeout(() => $(`#${notificationId}`).fadeOut(500, function() { $(this).remove(); }), 5000);
    }
  </script>
</body>
</html>
